name: Build STUDYFLO APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: bun install

      - name: Install Capacitor
        run: |
          bun add @capacitor/core@^6.2.0 @capacitor/android@^6.2.0
          bun add -d @capacitor/cli@^6.2.0

      - name: Create Capacitor config (only if missing)
        run: |
          if [ ! -f capacitor.config.ts ] && [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.js ]; then
            cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.studyflo.app",
            "appName": "STUDYFLO",
            "webDir": "dist"
          }
          JSON
          fi

      - name: Build web app
        run: bun run build

      - name: Create Android project
        run: npx cap add android

      - name: Sync web files into Android project
        run: npx cap sync android

      - name: Add Maven mirror + retry settings for Gradle
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/mirror.gradle <<'GRADLE'
          // Extra mirror of Maven Central (Google-hosted) in case Maven Central fails.
          def addMirror = { repos ->
            repos.maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
          }
          beforeSettings { settings ->
            settings.pluginManagement.repositories { maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' } }
          }
          allprojects {
            buildscript.repositories { addMirror(delegate) }
            repositories { addMirror(delegate) }
          }
          GRADLE
          cat >> ~/.gradle/gradle.properties <<'PROPS'
          systemProp.org.gradle.internal.http.connectionTimeout=60000
          systemProp.org.gradle.internal.http.socketTimeout=60000
          systemProp.org.gradle.internal.repository.max.tentatives=5
          PROPS

      - name: Build debug APK (with retry)
        working-directory: android
        run: |
          chmod +x ./gradlew
          for i in 1 2 3; do
            echo "=== Gradle attempt $i ==="
            if ./gradlew assembleDebug --no-daemon --stacktrace; then
              exit 0
            fi
            sleep 15
          done
          exit 1

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk STUDYFLO.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: STUDYFLO-apk
          path: STUDYFLO.apk

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: STUDYFLO build ${{ github.run_number }}
          files: STUDYFLO.apk
